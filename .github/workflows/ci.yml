name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check Conventional Commit PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PY'
          import os, re
          title = os.environ['PR_TITLE']
          pattern = r'(feat|fix|docs|chore|ci|test|refactor|perf|build|style|revert)(\([^()\r\n]+\))?!?: \S[^\r\n]*'
          if not re.fullmatch(pattern, title):
              raise SystemExit('Use a Conventional Commit title, e.g. feat: add a skill')
          PY
      - name: Install validation dependencies
        run: python3 -m pip install -r requirements-dev.txt
      - name: Install pinned Agent Marketplace
        run: |
          bash scripts/install-cli.sh "$RUNNER_TEMP/registry-bin"
          echo "$RUNNER_TEMP/registry-bin" >> "$GITHUB_PATH"
      - name: Lint workflows and shell scripts
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint"
          shellcheck scripts/*.sh
      - name: Validate registry
        run: bash scripts/validate-registry.sh
      - name: Test validation and tagged updates
        run: python3 -m unittest discover -s tests -v

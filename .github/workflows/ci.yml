name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Conventional Commit PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PY'
          import os, re
          title = os.environ['PR_TITLE']
          pattern = r'(feat|fix|docs|chore|ci|test|refactor|perf|build|style|revert)(\([^()\r\n]+\))?!?: \S[^\r\n]*'
          if not re.fullmatch(pattern, title):
              raise SystemExit('Use a Conventional Commit title, e.g. feat: add a skill')
          PY
      - name: Install pinned Agent Marketplace
        run: |
          bash scripts/install-cli.sh "$RUNNER_TEMP/registry-bin"
          echo "$RUNNER_TEMP/registry-bin" >> "$GITHUB_PATH"
      - name: Lint workflows and shell scripts
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint"
          shellcheck scripts/*.sh
      - name: Validate registry with Agent Marketplace
        env:
          AGENT_MARKETPLACE_TELEMETRY_LEVEL: 'off'
        run: |
          set -o pipefail
          consumer="$RUNNER_TEMP/consumer"
          mkdir -p "$consumer/.agents"
          cp -R "$GITHUB_WORKSPACE" "$consumer/registry"
          cp .github/registry-check.yaml "$consumer/.agents/config.yaml"
          git init --quiet "$consumer"
          cd "$consumer"
          agent-marketplace sync --strict --verbose | tee "$RUNNER_TEMP/sync.log"
          # The CLI exits 0 when it skips a malformed skill, so check its summary.
          grep -Eq 'Malformed +0 +Errors +0' "$RUNNER_TEMP/sync.log"
          agent-marketplace sync --strict --check
          # Every resource must be selected by .github/registry-check.yaml.
          agent-marketplace list | tee "$RUNNER_TEMP/list.log"
          if grep -qw available "$RUNNER_TEMP/list.log"; then exit 1; fi
